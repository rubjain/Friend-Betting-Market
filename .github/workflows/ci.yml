name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agora_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agora_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/agora_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:migrate:deploy
      - run: npm run db:verify
      - run: npm test
      - run: npm run build
